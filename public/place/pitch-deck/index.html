<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>place</title>
  <meta name="description" content="Place — the world, your way." />
  <meta name="theme-color" content="#F4622A" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    // The deck is decrypted with Web Crypto, which browsers only allow on secure pages.
    if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https:' + location.href.slice(5));
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Place — Design System v2 (22 Sep 2026) */
    :root {
      --orange: #F4622A;
      --white: #FFFFFF;
      --ink: #15181F;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
    }

    body {
      background: var(--orange);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    /* ---------- Gate ---------- */
    .gate {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      text-align: center;
      transition: opacity .35s ease;
    }
    .gate.leaving { opacity: 0; }

    main.gate > div {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.75rem, 2vw, 1.25rem);
      width: 100%;
      transition: transform .35s ease;
    }
    .gate.leaving > div { transform: translateY(-12px); }

    .wordmark {
      margin: 0;
      font-family: 'Unbounded', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 16vw, 11rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: lowercase;
    }

    .unlock {
      margin-top: clamp(1.5rem, 4vw, 2.5rem);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(100%, 320px);
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .unlock input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      background: transparent;
      color: var(--white);
      caret-color: var(--white);
      font: inherit;
      font-size: 16px; /* 16px stops iOS zooming on focus */
      outline: none;
      transition: border-color .15s ease, background .15s ease;
    }
    .unlock input::placeholder { color: rgba(255, 255, 255, 0.8); }
    .unlock input:focus-visible { border-color: var(--white); }
    /* Stop browser autofill painting the field a solid colour */
    .unlock input:-webkit-autofill,
    .unlock input:-webkit-autofill:hover,
    .unlock input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--white);
      caret-color: var(--white);
      transition: background-color 9999s ease-out 0s;
    }
    .unlock input[aria-invalid="true"] { border-color: var(--ink); }

    .unlock button {
      width: 100%;
      height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: var(--white);
      color: var(--orange);
      font: inherit;
      font-size: 19px; /* bold 19px counts as large text, so orange on white meets contrast guidance */
      font-weight: 700;
      cursor: pointer;
      transition: transform .1s ease, opacity .15s ease;
    }
    .unlock button:hover { opacity: 0.9; }
    .unlock button:active { transform: scale(0.97); }
    .unlock button:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
    .unlock button:disabled { opacity: 0.7; cursor: progress; }

    .feedback {
      margin: 0;
      min-height: 1.5em;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }

    .shake { animation: shake .4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
      .gate, main.gate > div { transition: none; }
      .gate.leaving > div { transform: none; }
    }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <div>
      <h1 class="wordmark">place</h1>

      <form class="unlock" id="unlock" novalidate>
        <label class="visually-hidden" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password"
               autocomplete="current-password" autocapitalize="off" spellcheck="false"
               aria-describedby="feedback" required />
        <button type="submit">Enter</button>
      </form>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </div>
  </main>

  <div id="deck" hidden></div>

  <script>
    (function () {
      const form = document.getElementById('unlock');
      const input = document.getElementById('password');
      const button = form.querySelector('button');
      const feedback = document.getElementById('feedback');
      const gate = document.getElementById('gate');
      const deck = document.getElementById('deck');
      const SESSION_KEY = 'place-deck-pw';

      const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      let bundle;
      async function loadBundle() {
        if (!bundle) {
          const res = await fetch('deck.enc.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('load');
          bundle = await res.json();
        }
        return bundle;
      }

      // Resolves to the deck HTML, or rejects with Error('password') / Error('load').
      async function decrypt(password) {
        const b = await loadBundle();
        const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(b.salt), iterations: b.iterations },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt'],
        );
        try {
          const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(b.iv) }, key, fromB64(b.data));
          return new TextDecoder().decode(plain);
        } catch {
          throw new Error('password');
        }
      }

      async function showDeck(html, animate) {
        deck.innerHTML = html;
        // Animations are a nice-to-have: if they fail to load, show the deck without them.
        let motion = null;
        try {
          const { prepareDeckMotion } = await import('./deck-motion.js');
          motion = await prepareDeckMotion(deck);
        } catch {}
        const reveal = () => {
          gate.remove();
          deck.hidden = false;
          document.title = 'place — Pre-Seed Deck';
          window.scrollTo(0, 0);
          if (motion) motion.start();
        };
        if (animate) {
          gate.classList.add('leaving');
          setTimeout(reveal, 350);
        } else {
          reveal();
        }
      }

      function fail(message) {
        feedback.textContent = message;
        input.setAttribute('aria-invalid', 'true');
        form.classList.remove('shake');
        void form.offsetWidth; // restart the animation
        form.classList.add('shake');
        input.focus();
        input.select();
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = input.value;
        if (!password) {
          fail('Please enter the password.');
          return;
        }
        if (!window.crypto || !crypto.subtle) {
          fail('This browser can’t open the deck. Please use an up-to-date browser over https.');
          return;
        }
        button.disabled = true;
        button.textContent = 'Checking…';
        feedback.textContent = '';
        input.removeAttribute('aria-invalid');
        try {
          const html = await decrypt(password);
          try { sessionStorage.setItem(SESSION_KEY, password); } catch {}
          showDeck(html, true);
        } catch (err) {
          fail(err.message === 'password'
            ? "That password isn't right. Please try again."
            : "Couldn't load the deck. Check your connection and try again.");
        } finally {
          button.disabled = false;
          button.textContent = 'Enter';
        }
      });

      input.addEventListener('input', () => {
        if (input.hasAttribute('aria-invalid')) {
          input.removeAttribute('aria-invalid');
          feedback.textContent = '';
        }
      });

      // Stay unlocked on refresh within the same browser tab.
      let saved = null;
      try { saved = sessionStorage.getItem(SESSION_KEY); } catch {}
      if (saved) {
        decrypt(saved).then((html) => showDeck(html, false)).catch(() => {
          try { sessionStorage.removeItem(SESSION_KEY); } catch {}
        });
      }
    })();
  </script>
</body>
</html>
