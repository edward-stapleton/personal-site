<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ed Stapleton</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fafaf7" />
  <script>
    // The page is decrypted with Web Crypto, which browsers only allow on secure pages.
    if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https:' + location.href.slice(5));
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preload" href="fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/geist-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    @font-face { font-family: 'Geist'; font-weight: 400; font-display: swap; src: url(fonts/geist-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Geist'; font-weight: 500; font-display: swap; src: url(fonts/geist-latin-500-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Geist'; font-weight: 600; font-display: swap; src: url(fonts/geist-latin-600-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: swap; src: url(fonts/geist-mono-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: swap; src: url(fonts/geist-mono-latin-500-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }

    /* Ed Stapleton brand tokens, from the "Quiet machine" design system (src/styles/global.css) */
    :root {
      --paper: #fafaf7; --paper-2: #f4f3ee; --paper-3: #eceae2;
      --ink: #0a0a0b; --ink-2: #2a2a2c; --ink-3: #5a5a5e; --ink-4: #8a8a8e;
      --line: #e0ded7; --accent: #2547f5; --accent-soft: #dfe5fe;
      --positive: #1e7a4c; --warning: #b26b12; --negative: #b53d2e;
      --sun: #e3a514; --sun-soft: #f6e3b4; --muted-bar: #c9c7bf;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --r-md: 10px; --r-lg: 16px;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --pad-x: clamp(16px, 4.5vw, 64px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0a0a0b; --paper-2: #161618; --paper-3: #1f1f22;
        --ink: #fafaf7; --ink-2: #d6d5cf; --ink-3: #8a8a8e; --ink-4: #5a5a5e;
        --line: #2a2a2c; --accent: #4d6bff; --accent-soft: #1c2450;
        --positive: #3fb47a; --warning: #e0a04a; --negative: #e0705f;
        --sun: #f0b429; --sun-soft: #3a2e10; --muted-bar: #3a3a3e;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--font-sans); font-size: 17px; line-height: 1.5; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    button { font: inherit; color: inherit; }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .mono-label { display: block; margin: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    .wordmark { display: inline-flex; align-items: baseline; gap: 2px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
    .wordmark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

    /* ---------- Gate ---------- */
    .gate { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 16px; transition: opacity .35s ease; }
    .gate.leaving { opacity: 0; }
    .gate__inner { width: min(100%, 360px); display: flex; flex-direction: column; gap: 20px; }
    .gate h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 3.25rem); line-height: 1.04; letter-spacing: -0.035em; font-weight: 600; }
    .gate h1 em { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .unlock { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .unlock input { height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper-2); color: var(--ink); font: inherit; font-size: 16px; outline: none; transition: border-color .15s ease; }
    .unlock input:focus-visible { border-color: var(--accent); }
    .unlock input[aria-invalid="true"] { border-color: var(--negative); }
    .unlock button { height: 48px; border: 0; border-radius: var(--r-md); background: var(--ink); color: var(--paper); font-weight: 600; cursor: pointer; transition: opacity .15s ease, transform .1s ease; }
    .unlock button:hover { opacity: .88; }
    .unlock button:active { transform: scale(.98); }
    .unlock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .unlock button:disabled { opacity: .6; cursor: progress; }
    .feedback { margin: 0; min-height: 1.5em; font-size: 15px; color: var(--negative); }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* ---------- Deck shell ---------- */
    .deck { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .deck__top { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad-x); border-bottom: 1px solid var(--line); }
    .deck__actions { display: flex; align-items: center; gap: 20px; }
    .pdfbtn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    .pdfbtn:hover { background: var(--paper-2); border-color: var(--ink-4); }
    .pdfbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pdfbtn:disabled { opacity: .6; cursor: progress; }
    .pdfbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    /* Used only to render the PDF: every slide laid out as its own 16:9 page */
    body.print-mode { height: auto; }
    .print-mode .deck { position: static; display: block; }
    .print-mode .deck__top, .print-mode .deck__bar { display: none; }
    .print-mode .deck__stage { overflow: visible; }
    .print-mode .slide { position: relative; inset: auto; width: 1600px; height: 900px; opacity: 1; visibility: visible; transform: none; transition: none; overflow: hidden; break-after: page; }
    .print-mode .slide::after { content: 'Ed Stapleton · Home energy plan · November 2026'; position: absolute; left: var(--pad-x); bottom: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); }
    .print-mode .slide:last-child { break-after: auto; }
    .print-mode .seg { display: none; }
    .print-mode .s-cover::after { color: #fff; left: auto; right: 16px; }
    .deck__stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .deck__bar { flex: none; display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 var(--pad-x); border-top: 1px solid var(--line); }
    .progress { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .45s var(--ease); }
    .count { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
    .navbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    .navbtn:hover { background: var(--paper-2); border-color: var(--ink-4); }
    .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .navbtn:disabled { opacity: .35; cursor: default; }
    .navbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .slide {
      position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
      padding: clamp(20px, 4vh, 44px) var(--pad-x) clamp(16px, 3vh, 32px);
      display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 24px);
      opacity: 0; visibility: hidden; transform: translateX(24px);
      transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s linear .45s;
    }
    .slide.is-before { transform: translateX(-24px); }
    .slide.is-active { opacity: 1; visibility: visible; transform: none; transition: opacity .45s var(--ease), transform .45s var(--ease); }

    /* ---------- Type ---------- */
    .slide h1, .slide h2 { margin: 0; font-weight: 600; letter-spacing: -0.035em; line-height: 1.04; }
    .slide h1 { font-size: clamp(2.6rem, 6.2vw, 5.5rem); }
    .slide h2 { font-size: clamp(1.75rem, 3.6vw, 3.1rem); }
    .slide p { margin: 0; }
    .serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    .hl { color: var(--accent); }
    strong { font-weight: 600; color: var(--ink); }
    .lede { font-size: clamp(1.1rem, 1.7vw, 1.4rem); color: var(--ink-2); max-width: 34ch; }
    .byline { color: var(--ink-3); font-size: 14px; }

    .s-head { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .s-head > div:first-child { display: flex; flex-direction: column; gap: 10px; }
    .s-chart__plot { flex: 1 1 auto; min-height: 260px; position: relative; }
    .s-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .s-foot__note { flex: none; color: var(--ink-3); font-size: 14px; max-width: 70ch; }

    /* ---------- Charts ---------- */
    .chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .chart-svg text { font-family: var(--font-mono); font-size: 12px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
    .chart-svg .v { font-family: var(--font-sans); font-size: 14px; font-weight: 600; fill: var(--ink); }
    .chart-svg .v--big { font-size: 22px; letter-spacing: -0.02em; }
    .chart-svg .ann { font-family: var(--font-sans); font-size: 14px; fill: var(--ink-2); }
    .chart-svg .ann-b { font-family: var(--font-sans); font-size: 14px; font-weight: 600; fill: var(--ink); }
    .chart-svg .lab { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .chart-svg .base { stroke: var(--ink-2); stroke-width: 1; }
    .chart-svg .gl { stroke: var(--line); stroke-width: 1; }
    .chart-svg rect.bar, .chart-svg path.area { transition: opacity .2s ease; }
    .legend { position: absolute; top: 0; right: 0; display: flex; gap: 16px; font-size: 13px; color: var(--ink-3); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .chart-tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 10px; border-radius: 6px; opacity: 0; transition: opacity .12s ease; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); flex: none; }
    .seg button { border: 0; background: none; padding: 5px 16px; border-radius: 999px; font-family: var(--font-mono); font-size: 13px; cursor: pointer; color: var(--ink-3); }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .quickwin { flex: 0 1 520px; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid var(--positive); border-radius: var(--r-md); background: var(--paper-2); }
    .quickwin .mono-label { color: var(--positive); }
    .quickwin p { font-size: 15px; color: var(--ink-2); line-height: 1.4; }

    /* ---------- Cover ---------- */
    .s-cover { flex-direction: row; align-items: stretch; gap: clamp(24px, 4vw, 64px); padding-right: 0; padding-bottom: 0; padding-top: 0; }
    .s-cover__text { flex: 1 1 46%; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding-block: 32px; }
    .s-cover__img { flex: 1 1 54%; margin: 0; position: relative; min-height: 280px; }
    .s-cover__img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 40%; display: block; }
    .s-cover__img figcaption { position: absolute; left: 16px; bottom: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

    /* ---------- Heating split bar ---------- */
    .splitbar { flex: none; display: flex; width: 100%; height: 64px; border-radius: var(--r-md); overflow: hidden; }
    .splitbar > div { display: flex; flex-direction: column; justify-content: center; padding: 0 16px; min-width: 0; white-space: nowrap; overflow: hidden; }
    .splitbar strong { font-size: 20px; letter-spacing: -0.02em; color: inherit; }
    .splitbar span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
    .splitbar .sb-heat { background: var(--accent); color: #fff; }
    .splitbar .sb-other { background: var(--muted-bar); color: var(--ink); }
    .splitbar .sb-stand { background: var(--paper-3); color: var(--ink-3); min-width: 120px; }

    /* ---------- House ---------- */
    .s-house { flex-direction: row; align-items: center; gap: clamp(24px, 4vw, 64px); }
    .s-house__text { flex: 1 1 38%; display: flex; flex-direction: column; gap: 22px; }
    .s-house__art { flex: 1 1 62%; align-self: stretch; position: relative; min-height: 300px; }
    .s-house__art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .callouts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
    .callouts li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; color: var(--ink-2); }
    .callouts b { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }

    /* ---------- Plan ---------- */
    .plan { flex: 1 1 auto; max-height: 440px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 0.8fr); gap: 16px; min-height: 0; }
    .pcard { display: flex; flex-direction: column; gap: 14px; padding: clamp(18px, 2.4vw, 28px); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper-2); }
    .pcard--opt { background: transparent; border-style: dashed; }
    .pcard__n { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
    .pcard--opt .pcard__n { color: var(--ink-3); }
    .pcard h3 { margin: 0; font-size: clamp(1.15rem, 1.6vw, 1.45rem); letter-spacing: -0.02em; }
    .pcard__save { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
    .pcard__save b { font-size: clamp(2.2rem, 4vw, 3.6rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: var(--positive); font-variant-numeric: tabular-nums; }
    .pcard--opt .pcard__save b { color: var(--ink-3); font-size: clamp(1.6rem, 2.6vw, 2.4rem); }
    .pcard__desc { color: var(--ink-2); font-size: 15px; }
    .pcard__meta { display: flex; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .pcard__meta span:last-child { color: var(--ink-3); }

    /* ---------- Solar spec row ---------- */
    .specrow { flex: none; margin: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .specrow div { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
    .specrow dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
    .specrow dd { margin: 0; font-size: 15px; color: var(--ink); }

    /* ---------- Heat pump units ---------- */
    .units { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(16px, 3vh, 32px); min-height: 0; }
    .urow { display: grid; grid-template-columns: minmax(150px, 0.9fr) auto 2.6fr minmax(160px, 1fr); gap: clamp(12px, 2vw, 28px); align-items: center; }
    .urow__name { display: flex; flex-direction: column; gap: 4px; }
    .urow__name strong { font-size: clamp(1.1rem, 1.6vw, 1.4rem); letter-spacing: -0.02em; }
    .urow__in, .urow__out { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .unit { width: clamp(44px, 6vw, 84px); aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; }
    .unit svg { width: 55%; height: 55%; }
    .unit--in { background: var(--paper-3); color: var(--ink-2); }
    .unit--out { background: var(--warning); color: #fff; }
    .unit--half { width: calc(clamp(44px, 6vw, 84px) / 2); aspect-ratio: auto; height: clamp(44px, 6vw, 84px); }
    .urow__arrow { color: var(--ink-3); font-family: var(--font-mono); font-size: 14px; padding: 0 6px; }
    .urow__total { display: flex; flex-direction: column; gap: 2px; text-align: right; }
    .urow__total b { font-size: clamp(1.6rem, 3vw, 2.6rem); letter-spacing: -0.04em; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
    .urow--hp .urow__total b { color: var(--positive); }
    .urow__total span { font-size: 13px; color: var(--ink-3); }
    .compare { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .compare__col { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 15px; }
    .compare__col--pick { border-color: var(--accent); background: var(--paper-2); }
    .compare__col--pick .mono-label { color: var(--accent); }
    .compare__cost { font-weight: 600; color: var(--ink); font-size: 17px; }
    .compare__cost span { font-weight: 400; color: var(--ink-3); font-size: 14px; }

    /* ---------- Calculator ---------- */
    .chips { flex: none; display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--paper); font-size: 15px; transition: border-color .15s ease, background .15s ease; }
    .chip input { position: absolute; opacity: 0; pointer-events: none; }
    .chip i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-4); display: grid; place-items: center; transition: background .15s ease, border-color .15s ease; }
    .chip i::after { content: ''; width: 8px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
    .chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .chip input:checked + i { background: var(--accent); border-color: var(--accent); }
    .chip input:checked + i::after { opacity: 1; }
    .chip input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip span { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
    .chip--alt { border-style: dashed; }
    .tariff { flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .seg--lg button { padding: 8px 18px; font-family: var(--font-sans); font-size: 15px; font-weight: 500; }
    .seg--lg button small { font-family: var(--font-mono); font-size: 12px; opacity: .7; margin-left: 6px; }
    .figs { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .figs > div { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
    .figs b { font-size: clamp(1.5rem, 2.8vw, 2.5rem); font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .figs .f-after b { color: var(--accent); }
    .figs .f-save b { color: var(--positive); }
    .figs .f-sm b { font-size: clamp(1.15rem, 1.9vw, 1.6rem); }

    /* ---------- Payback cost row ---------- */
    .costrow { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .costrow div { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
    .costrow strong { font-size: 17px; font-variant-numeric: tabular-nums; }
    .costrow div:last-child strong { color: var(--positive); }

    /* ---------- Lists ---------- */
    .s-list, .s-plan { justify-content: center; }
    .grid8 { flex: 0 1 auto; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 16px; counter-reset: a; }
    .grid8 li { counter-increment: a; padding: 24px; min-height: 180px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper-2); color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; font-size: 17px; }

    .owners { flex: 0 1 auto; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; align-items: stretch; }
    .owners__col { padding: 26px; min-height: 260px; border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 14px; }
    .owners__col:first-child { border-color: var(--positive); background: var(--paper-2); }
    .owner { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .owners__col:first-child .owner { color: var(--positive); }
    .owners ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; color: var(--ink-2); font-size: 18px; line-height: 1.45; }
    .owners li { padding-left: 18px; position: relative; }
    .owners li::before { content: ''; position: absolute; left: 0; top: 10px; width: 8px; height: 2px; background: var(--ink-4); }

    /* ---------- Rooms ---------- */
    .rooms-wrap { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: clamp(16px, 3vw, 40px); }
    .rooms { display: flex; flex-wrap: wrap; align-content: stretch; gap: 6px; min-height: 340px; }
    .room { flex-grow: var(--a); flex-basis: calc(var(--b) * 1%); min-width: 96px; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; background: var(--paper-3); color: var(--ink-2); position: relative; }
    .room strong { color: inherit; font-size: 15px; letter-spacing: -0.01em; line-height: 1.2; }
    .room small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; opacity: .8; }
    .room em { font-style: normal; font-size: 12px; opacity: .85; }
    .room__kw { font-size: clamp(1.2rem, 2vw, 1.8rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
    .room--unit { background: var(--accent); color: #fff; }
    .room--optional { background: var(--accent-soft); color: var(--ink); outline: 1.5px dashed var(--accent); outline-offset: -1.5px; }
    .rooms-side { display: flex; flex-direction: column; gap: 18px; }
    .rooms-side div { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
    .rooms-side b { font-size: clamp(1.6rem, 2.6vw, 2.3rem); font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .rooms-side p { font-size: 15px; color: var(--ink-2); }

    /* ---------- Gantt ---------- */
    .gantt { flex: 1 1 auto; position: relative; min-height: 320px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .s-cover, .s-house { flex-direction: column; padding: 20px var(--pad-x) 24px; }
      .s-cover__img { order: -1; flex: none; height: 38vh; margin: -20px calc(var(--pad-x) * -1) 0; }
      .s-cover__text { padding-block: 0; }
      .s-house__art { flex: none; height: 42vh; width: 100%; }
      .plan { grid-template-columns: 1fr 1fr; }
      .specrow, .costrow { grid-template-columns: 1fr 1fr; }
      .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid8 { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; }
      .owners { grid-template-columns: 1fr; }
      .rooms-wrap { grid-template-columns: 1fr; }
      .rooms { min-height: 0; }
      .room { min-height: 84px; }
      .urow { grid-template-columns: 1fr auto; }
      .urow__in, .urow__arrow, .urow__out { grid-column: 1 / -1; }
      .urow__name { grid-row: 1; } .urow__total { grid-row: 1; grid-column: 2; }
      .compare { grid-template-columns: 1fr; }
      .s-foot { flex-direction: column; align-items: stretch; }
      .quickwin { flex: none; }
      .s-chart__plot { min-height: 300px; }
      .splitbar strong { font-size: 16px; }
    }
    @media (max-width: 520px) {
      body { font-size: 16px; }
      .plan, .grid8 { grid-template-columns: 1fr; }
      .figs { grid-template-columns: 1fr 1fr; }
      .splitbar { height: 56px; }
      .splitbar > div { padding: 0 10px; }
      .splitbar span { display: none; }
      .s-head { flex-direction: column; align-items: flex-start; }
      #deck-title { display: none; }

    }
    @media (prefers-reduced-motion: reduce) {

      .shake { animation: none; }
    }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <div class="gate__inner">
      <a class="wordmark" href="/" aria-label="Ed Stapleton, home"><span>Ed Stapleton</span><span class="dot" aria-hidden="true"></span></a>
      <p class="mono-label">Private page</p>
      <h1>Home energy <em>plan.</em></h1>
      <form class="unlock" id="unlock" novalidate>
        <label class="visually-hidden" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password"
               autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-describedby="feedback" required />
        <button type="submit">Open</button>
      </form>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </div>
  </main>

  <div class="deck" id="deck" hidden>
    <header class="deck__top">
      <a class="wordmark" href="/" aria-label="Ed Stapleton, home"><span>Ed Stapleton</span><span class="dot" aria-hidden="true"></span></a>
      <div class="deck__actions">
        <span class="mono-label" id="deck-title"></span>
        <button class="pdfbtn" id="pdf" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>Download PDF</span></button>
      </div>
    </header>
    <div class="deck__stage" id="stage" aria-live="polite"></div>
    <nav class="deck__bar" aria-label="Slides">
      <button class="navbtn" id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <span class="count" id="count"></span>
      <button class="navbtn" id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </nav>
  </div>
  <div class="chart-tip" id="tip" role="presentation"></div>

  <script>
  (function () {
    /* ================= Unlock ================= */
    const form = document.getElementById('unlock');
    const input = document.getElementById('password');
    const button = form.querySelector('button');
    const feedback = document.getElementById('feedback');
    const gate = document.getElementById('gate');
    const deckEl = document.getElementById('deck');
    const SESSION_KEY = 'portway-deck-pw';
    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    let bundle;
    async function loadBundle() {
      if (!bundle) {
        const res = await fetch('deck.enc.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('load');
        bundle = await res.json();
      }
      return bundle;
    }
    let currentPassword = '';
    async function decryptBytes(password, b) {
      const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(b.salt), iterations: b.iterations }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(b.iv) }, key, fromB64(b.data));
    }
    async function decrypt(password) {
      const b = await loadBundle();
      const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(b.salt), iterations: b.iterations }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      try {
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(b.iv) }, key, fromB64(b.data));
        return new TextDecoder().decode(plain);
      } catch { throw new Error('password'); }
    }
    function fail(message) {
      feedback.textContent = message;
      input.setAttribute('aria-invalid', 'true');
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      input.focus(); input.select();
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = input.value;
      if (!password) { fail('Please enter the password.'); return; }
      if (!window.crypto || !crypto.subtle) { fail('This browser can’t open the page. Please use an up-to-date browser.'); return; }
      button.disabled = true; button.textContent = 'Checking…'; feedback.textContent = ''; input.removeAttribute('aria-invalid');
      try {
        const html = await decrypt(password);
        currentPassword = password;
        try { sessionStorage.setItem(SESSION_KEY, password); } catch {}
        reveal(html, true);
      } catch (err) {
        fail(err.message === 'password' ? 'That password isn’t right. Please try again.' : 'Couldn’t load the page. Check your connection and try again.');
      } finally { button.disabled = false; button.textContent = 'Open'; }
    });
    input.addEventListener('input', () => { if (input.hasAttribute('aria-invalid')) { input.removeAttribute('aria-invalid'); feedback.textContent = ''; } });
    let saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch {}
    if (saved) decrypt(saved).then((html) => { currentPassword = saved; reveal(html, false); }).catch(() => { try { sessionStorage.removeItem(SESSION_KEY); } catch {} });
    function reveal(html, animate) {
      const go = () => { gate.remove(); deckEl.hidden = false; startDeck(html); };
      if (animate) { gate.classList.add('leaving'); setTimeout(go, 350); } else go();
    }

    /* ================= Model ================= */
    function runModel(D, opts) {
      const s = D.spec, R = opts.rates || D.rates, exportRate = opts.exportRate || 0.06;
      const months = [];
      for (let i = 0; i < 12; i++) {
        const days = D.days[i];
        const base = s.baselinePerDay * days, baseNight = base * s.baselineNightShare, baseDay = base - baseNight;
        let heatDay = Math.max(D.dayKwh[i] - baseDay, 0), heatNight = Math.max(D.nightKwh[i] - baseNight, 0);
        let hw = s.hotWaterPerDay * days;
        const otherDay = baseDay, otherNight = baseNight - hw;
        if (opts.insulation) { heatDay *= 1 - s.insulationCut; heatNight *= 1 - s.insulationCut; }
        if (opts.heatPump) {
          const heat = heatDay + heatNight, left = heat * (1 - s.heatPumpCoverage), hp = heat * s.heatPumpCoverage / s.heatPumpScop;
          const share = heat ? heatDay / heat : 0.5;
          heatDay = left * share + hp * s.heatPumpDayShare;
          heatNight = left * (1 - share) + hp * (1 - s.heatPumpDayShare);
        }
        if (opts.hotWater) hw /= s.hotWaterCop;
        let day = otherDay + heatDay, night = otherNight + heatNight + hw, exported = 0, gen = 0;
        if (opts.solar) {
          gen = D.solarPerKwp[i] * s.solarKwp;
          const toDay = Math.min(gen * s.batteryEfficiency, day); day -= toDay;
          let surplus = gen - toDay / s.batteryEfficiency;
          const toNight = Math.min(surplus * s.batteryEfficiency, night * 0.5); night -= toNight;
          surplus -= toNight / s.batteryEfficiency; exported = Math.max(surplus, 0);
          if (day > 0) { const shift = Math.min(day, s.batteryKwh * 0.9 * days); day -= shift; night += shift / s.batteryEfficiency; }
        }
        const cost = day * R.day + night * R.night + days * R.standingPerDay - exported * exportRate;
        months.push({ day, night, kwh: day + night, gen, exported, cost });
      }
      return { months, total: months.reduce((a, m) => a + m.cost, 0) };
    }

    /* ================= Chart helpers ================= */
    const NS = 'http://www.w3.org/2000/svg';
    const tip = document.getElementById('tip');
    const gbp = (n) => (n < 0 ? '-£' : '£') + Math.round(Math.abs(n)).toLocaleString('en-GB');
    const gbpK = (n) => (n < 0 ? '-£' : '£') + (Math.abs(n) >= 1000 ? (Math.abs(n) / 1000).toFixed(Math.abs(n) % 1000 ? 1 : 0).replace('.0', '') + 'k' : Math.round(Math.abs(n)));
    const kwhF = (n) => Math.round(n).toLocaleString('en-GB');
    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    function el(name, attrs, parent, text) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
    function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 1.5 ? 1.5 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 3 ? 3 : m <= 4 ? 4 : m <= 5 ? 5 : m <= 6 ? 6 : m <= 8 ? 8 : 10) * p; }
    function frame(host) {
      host.querySelector('.chart-svg')?.remove();
      host.querySelector('.legend')?.remove();
      const r = host.getBoundingClientRect();
      const W = Math.max(Math.round(r.width), 280), H = Math.max(Math.round(r.height), 220);
      const svg = el('svg', { class: 'chart-svg', viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' }, host);
      return { svg, W, H };
    }
    function legend(host, items) {
      const lg = document.createElement('div'); lg.className = 'legend';
      lg.innerHTML = items.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
      host.appendChild(lg);
    }
    function hover(node, text) {
      node.addEventListener('pointerenter', (e) => { if (!e.clientX && !e.clientY) return; tip.textContent = text; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY - 34 + 'px'; tip.style.opacity = 1; });
      node.addEventListener('pointermove', (e) => { tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY - 34 + 'px'; });
      node.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
    }
    const compact = () => window.innerWidth < 620;

    // Stacked or grouped bars with values printed on the bars. No y-axis: the numbers are the axis.
    function bars(host, { labels, series, mode = 'stack', fmt = gbp, total = true, highlight = [], refLine = null, legendItems }) {
      const { svg, W, H } = frame(host);
      const top = legendItems ? 40 : 28, bottom = 26, L = 0, R = 0;
      const totals = labels.map((_, i) => mode === 'stack' ? series.reduce((a, s) => a + Math.max(s.values[i], 0), 0) : Math.max(...series.map((s) => s.values[i])));
      const max = Math.max(...totals) * 1.04 || 1;
      const y = (v) => top + (H - top - bottom) * (1 - v / max);
      const step = (W - L - R) / labels.length, bw = Math.min(step * (mode === 'group' ? 0.78 : 0.66), 120);
      labels.forEach((lab, i) => {
        const x0 = L + step * i + (step - bw) / 2;
        let acc = 0;
        series.forEach((s, j) => {
          const v = Math.max(s.values[i], 0);
          let x = x0, w = bw, y1, h;
          if (mode === 'stack') { y1 = y(acc + v); h = y(acc) - y1; acc += v; }
          else { w = bw / series.length - 2; x = x0 + (bw / series.length) * j; y1 = y(v); h = y(0) - y1; }
          const fill = highlight.length && !highlight.includes(i) && s.dimmable !== false ? s.color : s.color;
          const r = el('rect', { class: 'bar', x, y: y1, width: Math.max(w, 1), height: Math.max(h, 0), fill, rx: mode === 'group' ? 3 : 0 }, svg);
          hover(r, `${lab} · ${s.name}: ${fmt(s.values[i])}`);
          if (mode === 'group' && !compact()) {
            const t = el('text', { x: x + w / 2, y: y1 - 6, 'text-anchor': 'middle', class: 'v' }, svg, fmt === gbp ? gbpK(s.values[i]) : kwhF(s.values[i]));
            t.setAttribute('style', `fill:${s.textColor || 'var(--ink-2)'};font-size:12px`);
          }
        });
        if (mode === 'stack' && total && !(compact() && highlight.length && !highlight.includes(i))) {
          const big = highlight.includes(i);
          el('text', { x: x0 + bw / 2, y: y(totals[i]) - 8, 'text-anchor': 'middle', class: 'v' + (big ? ' v--big' : '') }, svg, compact() ? gbpK(totals[i]).replace('£', fmt === gbp ? '£' : '') : (fmt === gbp ? gbp(totals[i]) : kwhF(totals[i])));
        }
        el('text', { x: L + step * i + step / 2, y: H - 6, 'text-anchor': 'middle' }, svg, compact() ? lab[0] : lab);
      });
      el('line', { x1: 0, x2: W, y1: y(0), y2: y(0), class: 'base' }, svg);
      if (refLine) {
        const yy = y(refLine.value);
        el('line', { x1: 0, x2: W, y1: yy, y2: yy, stroke: 'var(--ink)', 'stroke-width': 1.5, 'stroke-dasharray': '5 5' }, svg);
        const t = el('text', { x: W - 4, y: yy - 8, 'text-anchor': 'end', class: 'ann-b' }, svg, refLine.label);
        t.setAttribute('style', 'paint-order:stroke;stroke:var(--paper);stroke-width:4px');
      }
      if (legendItems) legend(host, legendItems);
      return { y, step };
    }

    function smoothPath(pts) {
      let d = `M${pts[0][0]},${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2;
        d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
      }
      return d;
    }

    /* ================= House ================= */
    function houseSvg() {
      let panels = '';
      const px0 = 120, py0 = 92, pw = 33, ph = 25, gap = 3;
      for (let r = 0; r < 2; r++) for (let c = 0; c < 8; c++) {
        const x = px0 + c * (pw + gap), y = py0 + r * (ph + gap);
        panels += `<rect x="${x}" y="${y}" width="${pw}" height="${ph}" rx="1.5" fill="#0d1530" stroke="#3a4a7a" stroke-width="0.8"/><line x1="${x + pw / 2}" y1="${y}" x2="${x + pw / 2}" y2="${y + ph}" stroke="#3a4a7a" stroke-width="0.5"/><line x1="${x}" y1="${y + ph / 2}" x2="${x + pw}" y2="${y + ph / 2}" stroke="#3a4a7a" stroke-width="0.5"/>`;
      }
      const win = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="var(--accent-soft)" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h}" stroke="var(--ink-2)" stroke-width="1"/>`;
      const pin = (n, x, y, lx, ly) => `<line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}" stroke="var(--accent)" stroke-width="1.2"/><circle cx="${lx}" cy="${ly}" r="11" fill="var(--accent)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" style="font-family:var(--font-mono);font-size:12px;fill:#fff">${n}</text>`;
      return `<svg viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Illustration of the house from the front, with 16 solar panels on the south-facing roof, a battery in the garage and a heat pump unit outside">
        <circle cx="500" cy="48" r="22" fill="var(--sun)"/>
        <g stroke="var(--sun)" stroke-width="2.4" stroke-linecap="round"><line x1="500" y1="12" x2="500" y2="4"/><line x1="536" y1="48" x2="546" y2="48"/><line x1="526" y1="22" x2="533" y2="15"/><line x1="526" y1="74" x2="533" y2="81"/><line x1="474" y1="22" x2="467" y2="15"/></g>
        <path d="M486 70 L420 112" stroke="var(--sun)" stroke-width="1.2" stroke-dasharray="3 4"/>
        <line x1="10" y1="312" x2="550" y2="312" stroke="var(--line)" stroke-width="2"/>
        <rect x="402" y="208" width="104" height="104" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="1.5"/>
        <polygon points="396,212 454,174 512,212" fill="var(--ink-4)" stroke="var(--ink-2)" stroke-width="1.5"/>
        <rect x="416" y="234" width="76" height="78" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.2"/>
        <g stroke="var(--ink-4)" stroke-width="1">${[246, 258, 270, 282, 294].map((y) => `<line x1="416" x2="492" y1="${y}" y2="${y}"/>`).join('')}</g>
        <rect x="474" y="276" width="14" height="26" rx="2" fill="var(--positive)" opacity=".85"/>
        <rect x="88" y="166" width="322" height="146" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="1.5"/>
        <polygon points="76,172 136,64 362,64 422,172" fill="var(--ink-4)" stroke="var(--ink-2)" stroke-width="1.5"/>
        <rect x="374" y="38" width="20" height="58" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="1.5"/>
        <rect x="370" y="32" width="28" height="8" fill="var(--ink-3)"/>
        ${panels}
        ${win(110, 190, 54, 40)}${win(196, 190, 54, 40)}${win(332, 190, 54, 40)}
        ${win(110, 252, 54, 40)}${win(332, 252, 54, 40)}
        <rect x="238" y="246" width="38" height="66" rx="2" fill="var(--ink-2)"/>
        <rect x="232" y="238" width="50" height="6" fill="var(--ink-3)"/>
        <rect x="292" y="272" width="30" height="26" rx="3" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.3"/>
        <circle cx="307" cy="285" r="8" fill="none" stroke="var(--ink-3)" stroke-width="1.3"/>
        ${pin(1, 210, 100, 196, 22)}${pin(2, 104, 150, 40, 120)}${pin(3, 481, 290, 538, 250)}${pin(4, 307, 298, 340, 345)}
      </svg>`;
    }

    /* ================= Deck ================= */
    function startDeck(html) {
      const stage = document.getElementById('stage');
      stage.innerHTML = html;

        if (e.target.closest('input, button, label') && (e.key === ' ' || e.key === 'Enter')) return;
        if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
        else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
        else if (e.key === 'Home') go(0); else if (e.key === 'End') go(slides.length - 1);
      });
      let sx = null, sy = null;
      stage.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
      stage.addEventListener('touchend', (e) => {
        if (sx === null) return;
        const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && !e.target.closest('.chips')) go(cur + (dx < 0 ? 1 : -1));
        sx = null;
      });
      const fromHash = parseInt(location.hash.slice(1), 10);
      go(Number.isFinite(fromHash) ? fromHash - 1 : 0, false);
      drawAll();
    }
  })();
  </script>
</body>
